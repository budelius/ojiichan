[project]
name = "ojiichan"
version = "0.9.4"
description = "Pseekoo diagnostics toolkit for ELK, Rustrak/Sentry/Bugsink, Scaleway Cockpit logs, and issue handoff workflows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Martin Wieser", email = "martin.wieser@pseekoo.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "opensearch-py>=2.6,<3",
    "httpx>=0.27",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.22",
]

[project.optional-dependencies]
vault = [
    "locke>=0.5.2",
]

[project.urls]
Homepage = "https://gitlab.com/martin-wieser/ojiichan"
Repository = "https://gitlab.com/martin-wieser/ojiichan"
Issues = "https://gitlab.com/martin-wieser/ojiichan/-/issues"

[project.scripts]
ojiichan = "ojiichan.cli:main"
ojiichan-mcp = "ojiichan_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Scaffold templates live under src/ojiichan/scaffolds/**/src/lib/, which the
# repo .gitignore excludes (lib/). Force them into the build artifacts so the
# `ojiichan scaffold` command works from an installed wheel.
[tool.hatch.build]
artifacts = ["src/ojiichan/scaffolds/**/*.tmpl"]

[tool.hatch.build.targets.wheel]
packages = ["src/ojiichan", "src/ojiichan_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/ojiichan", "src/ojiichan_mcp", "README.md", "LICENSE", "locke.json", "pyproject.toml"]
